name: LumaCore Ubuntu CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build LumaCore.sln -c Release

    - name: Test
      run: dotnet test LumaCore.sln -c Release --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura -- --report-xunit-trx --report-xunit-trx-filename test-results.trx

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Ubuntu Test Results
        path: '**/test-results.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Generate Test Badge
      if: github.ref == 'refs/heads/main' && always()
      run: |
        # Aggregate test results from all TRX files (one per test project)
        $trxFiles = Get-ChildItem -Path . -Filter "test-results.trx" -Recurse
        $total = 0
        $passed = 0
        foreach ($f in $trxFiles) {
          [xml]$trx = Get-Content $f.FullName
          $total += [int]$trx.TestRun.ResultSummary.Counters.total
          $passed += [int]$trx.TestRun.ResultSummary.Counters.passed
        }
        if ($total -gt 0) {
          # Use total-minus-passed instead of the "failed" counter alone — TRX distinguishes
          # "failed" (assertion) from "error" (fixture/infrastructure), and ignoring "error"
          # would keep the badge green when fixtures throw (e.g., database connection issues).
          $notPassed = $total - $passed
          $color = if ($notPassed -eq 0) { "brightgreen" } elseif ($notPassed -lt 3) { "yellow" } else { "red" }
          $message = "$passed/$total passed"

          $badge = @{
            schemaVersion = 1
            label = "Tests"
            message = $message
            color = $color
          } | ConvertTo-Json -Compress

          echo $badge > lumacore-ubuntu-test-badge.json
          echo "TEST_BADGE=$badge" >> $env:GITHUB_ENV
          echo "Test Badge: $message ($color)"
        }
      shell: pwsh

    - name: Generate Coverage Badge
      if: github.ref == 'refs/heads/main' && always()
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:TextSummary
        
        $summary = Get-Content "coveragereport/Summary.txt" | Out-String
        
        $lineCoverage = 0
        if ($summary -match "Line coverage: (\d+\.?\d*)%") {
          $lineCoverage = [math]::Round([double]$matches[1])
        }
        
        $branchCoverage = 0
        $hasBranch = $false
        if ($summary -match "Branch coverage: (\d+\.?\d*)%") {
          $branchCoverage = [math]::Round([double]$matches[1])
          $hasBranch = $true
        }
        
        $color = if ($lineCoverage -ge 90) { "brightgreen" } elseif ($lineCoverage -ge 75) { "yellow" } else { "red" }
        
        $message = "$lineCoverage%"
        if ($hasBranch) {
          $message = "L: $lineCoverage% | B: $branchCoverage%"
        }
        
        $badge = @{
          schemaVersion = 1
          label = "Coverage"
          message = $message
          color = $color
        } | ConvertTo-Json -Compress
        
        echo $badge > lumacore-ubuntu-coverage-badge.json
        echo "COVERAGE_BADGE=$badge" >> $env:GITHUB_ENV
        echo "Coverage Badge: $message ($color)"
      shell: pwsh

    - name: Update Test Badge
      if: github.ref == 'refs/heads/main' && always() && env.TEST_BADGE != ''
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id: d3957602a84fcab1aa66ebfef44da7eb
        file_path: lumacore-ubuntu-test-badge.json
        gist_file_name: lumacore-ubuntu-test-badge.json
        file_type: text

    - name: Update Coverage Badge
      if: github.ref == 'refs/heads/main' && always() && env.COVERAGE_BADGE != ''
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id: d3957602a84fcab1aa66ebfef44da7eb
        file_path: lumacore-ubuntu-coverage-badge.json
        gist_file_name: lumacore-ubuntu-coverage-badge.json
        file_type: text

    - name: Upload Coverage Artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-build-ubuntu
        path: '**/coverage.cobertura.xml'
        retention-days: 3
        if-no-files-found: warn

    # ──────────────────────────────────────────────────────────────────────────
    # API Documentation Verification
    # ──────────────────────────────────────────────────────────────────────────
    # Verifies that committed API documentation matches the current API surface.
    # Uses our pure .NET toolchain (LumaCore.OpenApiGen) - no npm required.
    # ──────────────────────────────────────────────────────────────────────────
    
    - name: Verify API Documentation
      run: pwsh -File ./build.net/OpenApi/verify-api-docs.ps1 -ApiProject src/LumaCore.Api/LumaCore.Api.csproj
    
    - name: Documentation Verification Failed
      if: failure()
      run: |
        echo "❌ API documentation may be outdated!"
        echo ""
        echo "To fix this issue:"
        echo "  1. Run locally: ./Pre-Commit-Actions.ps1"
        echo "  2. Review changes: git diff docs/api/"
        echo "  3. Commit updates: git add docs/api/ && git commit -m 'docs: update API documentation'"
        echo ""
