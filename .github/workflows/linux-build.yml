name: LumaCore Ubuntu CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build LumaCore.sln -c Release

    - name: Test
      run: dotnet test LumaCore.sln -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Ubuntu Test Results
        path: '**/test-results.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Generate Test Badge
      if: github.ref == 'refs/heads/main' && always()
      run: |
        # Parse test results from TRX file
        $trxFile = Get-ChildItem -Path . -Filter "test-results.trx" -Recurse | Select-Object -First 1
        if ($trxFile) {
          [xml]$trx = Get-Content $trxFile.FullName
          $total = [int]$trx.TestRun.ResultSummary.Counters.total
          $passed = [int]$trx.TestRun.ResultSummary.Counters.passed
          $failed = [int]$trx.TestRun.ResultSummary.Counters.failed
          
          $color = if ($failed -eq 0) { "brightgreen" } elseif ($failed -lt 3) { "yellow" } else { "red" }
          $message = "$passed/$total passed"
          
          $badge = @{
            schemaVersion = 1
            label = "Tests"
            message = $message
            color = $color
          } | ConvertTo-Json -Compress
          
          echo $badge > lumacore-ubuntu-test-badge.json
          echo "TEST_BADGE=$badge" >> $env:GITHUB_ENV
          echo "Test Badge: $message ($color)"
        }
      shell: pwsh

    - name: Update Test Badge Gist
      if: github.ref == 'refs/heads/main' && always() && env.TEST_BADGE != ''
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id: d3957602a84fcab1aa66ebfef44da7eb
        file_path: lumacore-ubuntu-test-badge.json
        gist_file_name: lumacore-ubuntu-test-badge.json
        file_type: text

    # ──────────────────────────────────────────────────────────────────────────
    # API Documentation Verification
    # ──────────────────────────────────────────────────────────────────────────
    # Verifies that committed API documentation matches the current API surface.
    # Uses our pure .NET toolchain (LumaCore.OpenApiGen) - no npm required.
    # ──────────────────────────────────────────────────────────────────────────
    
    - name: Verify API Documentation
      run: pwsh -File ./build.net/OpenApi/verify-api-docs.ps1 -ApiProject src/LumaCore.Api/LumaCore.Api.csproj
    
    - name: Documentation Verification Failed
      if: failure()
      run: |
        echo "❌ API documentation may be outdated!"
        echo ""
        echo "To fix this issue:"
        echo "  1. Run locally: ./Pre-Commit-Actions.ps1"
        echo "  2. Review changes: git diff docs/api/"
        echo "  3. Commit updates: git add docs/api/ && git commit -m 'docs: update API documentation'"
        echo ""
