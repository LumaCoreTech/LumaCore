name: LumaCore Windows CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Clean before build
      run: dotnet clean LumaCore.sln /p:RemoveArtifacts='true'

    - name: Build
      run: dotnet build LumaCore.sln -c Release /maxcpucount:1

    - name: Test
      run: dotnet test LumaCore.sln -c Release --no-build --verbosity normal
