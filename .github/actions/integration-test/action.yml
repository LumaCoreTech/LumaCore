# ──────────────────────────────────────────────────────────────────────────────
# Shared composite action for database integration tests.
#
# Contains the build, test, reporting, and badge generation logic used by all
# provider-specific caller workflows (integration-tests-*.yml). Each caller
# defines its own native `services` block for the required database container,
# then delegates the actual test execution to this action.
#
# Only the LumaCore.Data.Tests project is executed here — provider-independent
# tests (Core, API) are covered by the build workflows and are not repeated
# per provider. The build workflows run the same Data.Tests with the default
# provider (SQLite in-memory); these integration workflows re-run them against
# real database engines via Docker containers.
# ──────────────────────────────────────────────────────────────────────────────

name: 'Integration Test'
description: 'Builds and runs the integration test suite against a specific database provider'

inputs:
  provider:
    description: 'Database provider identifier (e.g., postgresql, sqlserver)'
    required: true
  display-name:
    description: 'Human-readable provider name for reports and badges'
    required: true
  connection-string:
    description: 'Database connection string'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build
      shell: bash
      run: dotnet build LumaCore.sln -c Release

    - name: Run Tests against ${{ inputs.display-name }}
      shell: bash
      run: >-
        dotnet test src/LumaCore.Data.Tests -c Release --no-build --verbosity normal
        /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
        -- --report-xunit-trx --report-xunit-trx-filename integration-${{ inputs.provider }}.trx
      env:
        LUMACORE_TESTS__Db__Provider: ${{ inputs.provider }}
        # The connection string provides transport/auth only (host, port, credentials) — no database
        # name. The database name is derived from DatabasePrefix (default: lumacore_test) plus a GUID
        # suffix per fixture for parallel isolation. See DbFixture / DbTestSettings for details.
        LUMACORE_TESTS__Db__ConnectionString: ${{ inputs.connection-string }}

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Integration Results (${{ inputs.display-name }})
        path: '**/integration-${{ inputs.provider }}.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Generate Test Badge
      if: github.ref == 'refs/heads/main' && always()
      shell: pwsh
      run: |
        $trxFile = Get-ChildItem -Path . -Filter "integration-${{ inputs.provider }}.trx" -Recurse | Select-Object -First 1
        if ($trxFile) {
          [xml]$trx = Get-Content $trxFile.FullName
          $total   = [int]$trx.TestRun.ResultSummary.Counters.total
          $passed  = [int]$trx.TestRun.ResultSummary.Counters.passed
          $skipped = [int]$trx.TestRun.ResultSummary.Counters.skipped

          # Count only genuine failures (failed + error), not skipped tests.
          # TRX distinguishes "failed" (assertion) from "error" (fixture/infrastructure);
          # both indicate real problems. Skipped tests are intentional (e.g. NoDrift skips
          # on non-SQL Server providers) and must not turn the badge yellow.
          $notPassed = $total - $passed - $skipped
          $color = if ($notPassed -eq 0) { "brightgreen" } elseif ($notPassed -lt 3) { "yellow" } else { "red" }
          $message = if ($skipped -gt 0) { "$passed/$total passed, $skipped skipped" } else { "$passed/$total passed" }

          $badge = @{
            schemaVersion = 1
            label = "${{ inputs.display-name }}"
            message = $message
            color = $color
          } | ConvertTo-Json -Compress

          echo $badge > lumacore-integration-${{ inputs.provider }}-badge.json
          echo "BADGE_JSON=$badge" >> $env:GITHUB_ENV
          echo "Badge: ${{ inputs.display-name }} — $message ($color)"
        }

    - name: Upload Badge Data
      if: github.ref == 'refs/heads/main' && always()
      uses: actions/upload-artifact@v7
      with:
        name: badge-data
        path: lumacore-integration-${{ inputs.provider }}-badge.json
        retention-days: 1
        if-no-files-found: ignore

    - name: Upload Coverage Artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-integration-${{ inputs.provider }}
        path: '**/coverage.cobertura.xml'
        retention-days: 3
        if-no-files-found: warn
