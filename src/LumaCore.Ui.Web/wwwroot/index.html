<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <link rel="alternate icon" href="favicon.svg"/>
    <link rel="manifest" href="manifest.webmanifest"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>LumaCore UI</title>
    <base href="/"/>

    <!-- Set HTML lang attribute from localStorage before any rendering -->
    <script src="js/lumacore.locale.js"></script>

    <!-- LumaCore Theme System: Initial theme loaded here, dynamic switching via JS -->
    <!-- Official themes: lumacore-dark (default), lumacore-light -->
    <!-- Community themes: missi-pink, ocean-blue, forest-green -->
    <link rel="stylesheet" href="themes/lumacore-dark/theme.css" id="theme-stylesheet"/>

    <!-- Application styles (use theme variables defined above) -->
    <link rel="stylesheet" href="LumaCore.Ui.Web.styles.css"/>
    <link rel="stylesheet" href="css/toast.css"/>
    <link rel="stylesheet" href="css/app-loading.css"/>

    <!-- LumaCore JavaScript - Theme MUST load before Blazor! -->
    <script src="js/lumacore.theme.js"></script>
    <script src="js/lumacore.icons.js"></script>
    <script src="js/lumacore.toast.js"></script>
</head>
<body>
<div id="app">
    <div class="app-loading">
        <img src="assets/branding/lumacore-logo.svg" alt="LumaCore" class="app-loading-logo"/>
        <p class="app-loading-text">Loading LumaCore...</p>
    </div>
</div>

<!-- ReSharper disable Html.PathError -->
<script src="_framework/blazor.webassembly.js"></script>
<!-- ReSharper restore Html.PathError -->
</body>
</html>
